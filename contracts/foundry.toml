[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "shanghai"
gas_reports = ["*"]
fuzz = { runs = 256 }
invariant = { depth = 32 }

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Arbiscan shares Etherscan's V2 API: one key, `chain` selects the network.
[etherscan]
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
robinhood_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 46630, enabled = false }

[rpc_endpoints]
# Primary target: Arbitrum Sepolia (hackathon submission network)
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC}"
# Robinhood Chain (Arbitrum Orbit L2) — where Paxos USDG natively lives
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"
robinhood = "${ROBINHOOD_RPC}"
# Arbitrum One mainnet
arbitrum = "${ARBITRUM_RPC}"
# Local development
anvil = "http://127.0.0.1:8545"

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
